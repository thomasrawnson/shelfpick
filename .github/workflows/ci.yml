name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and migrations
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: boardgamepicker_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d boardgamepicker_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/boardgamepicker_test
      LAUNCH_HARDENING_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/boardgamepicker_launch_hardening_test
      TIMER_INTEGRITY_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/boardgamepicker_timer_integrity_test
      RETENTION_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/boardgamepicker_retention_test
      JWT_SECRET: ci-only-secret-not-used-outside-tests

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Python dependency auditor
        run: python -m pip install pip-audit==2.10.1

      - name: Audit Python dependencies
        run: python -m pip_audit --strict --no-deps -r requirements.txt

      - name: Apply migrations to clean PostgreSQL database
        run: alembic upgrade head

      - name: Check models and migrations are aligned
        run: alembic check

      - name: Create isolated PostgreSQL test databases
        run: >-
          python -c "import psycopg;
          connection = psycopg.connect('postgresql://postgres:postgres@localhost:5432/boardgamepicker_test', autocommit=True);
          connection.execute('CREATE DATABASE boardgamepicker_launch_hardening_test');
          connection.execute('CREATE DATABASE boardgamepicker_timer_integrity_test');
          connection.execute('CREATE DATABASE boardgamepicker_retention_test');
          connection.close()"

      - name: Run backend tests without PostgreSQL skips
        run: python -m pytest

      - name: Run PostgreSQL launch-hardening tests without skips
        run: python -m pytest -q tests/test_launch_hardening_postgres.py

      - name: Run PostgreSQL timer-integrity tests without skips
        run: python -m pytest -q tests/test_timer_integrity_postgres.py

      - name: Run PostgreSQL retention tests without skips
        run: python -m pytest -q tests/test_retention_cleanup_postgres.py

  frontend:
    name: Frontend tests, lint and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit all frontend and build dependencies
        run: npm audit --audit-level=high

      - name: Run routing tests
        run: npm test

      - name: Run frontend lint
        run: npm run lint

      - name: Build production frontend
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8000
          VITE_LEGAL_DRAFTS_ENABLED: "false"
        run: npm run build

      - name: Validate generated PWA assets
        run: npm run check:pwa
