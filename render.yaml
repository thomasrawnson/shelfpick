services:
  - type: web
    name: board-game-picker-api
    runtime: python
    region: frankfurt
    plan: 0.5c-512mb
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: bash start.sh
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.14"
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: board-game-picker-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_MINUTES
        value: "1440"
      - key: AI_PICKER_ENABLED
        value: "false"
      - key: EXPORT_COVER_ARTWORK_ENABLED
        value: "false"
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: BGG_API_TOKEN
        sync: false
      - key: BETA_INVITE_EMAILS
        sync: false

  - type: web
    name: board-game-picker-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build && npm run check:pwa
    staticPublishPath: ./dist
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY

databases:
  - name: board-game-picker-db
    region: frankfurt
    plan: 0.1c-256mb
    postgresMajorVersion: "16"
    databaseName: boardgamepicker
    user: boardgamepicker
    diskSizeGB: 1
    ipAllowList: []
